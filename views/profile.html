<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUWILL | Digital Profile</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>L</text></svg>">
</head>
<body>
  <div class="page" id="profilePage" style="display:none">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-text">LUWILL</span>
        <span class="logo-sub" data-i18n="tagline">A Scent | A Presence</span>
      </div>
      <button class="lang-toggle" id="langToggle" aria-label="Switch language">
        <svg class="lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <span id="langLabel">English</span>
      </button>
    </header>

    <!-- Profile Section -->
    <section class="profile">
      <div class="avatar-wrap">
        <div class="avatar" id="avatar">
          <span class="avatar-placeholder" id="avatarPlaceholder">NL</span>
        </div>
      </div>
      <h1 class="name" id="empName">Nick Liu</h1>
      <p class="name-cn" id="empNameCn">刘宇亮</p>
      <div class="divider"></div>
      <p class="title" id="empTitle">Founder</p>
      <p class="title-cn" id="empTitleCn">创始人</p>
      <p class="signature" id="empSignature">Nick</p>
    </section>

    <!-- Brand Slogan -->
    <p class="slogan" data-i18n="slogan">SCENT CREATES A BETTER TOMORROW.</p>

    <!-- Contact Links -->
    <section class="contacts" id="contactsList"></section>

    <!-- Action Buttons -->
    <section class="actions">
      <button class="btn btn-save" id="saveContact">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        <span data-i18n="saveContact">保存联系人</span>
      </button>
      <button class="btn btn-share" id="shareBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/>
          <circle cx="6" cy="12" r="3"/>
          <circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
          <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        <span data-i18n="share">分享</span>
      </button>
    </section>

    <!-- QR Code Section -->
    <section class="qr-section">
      <p class="qr-label" data-i18n="qrLabel">我的专属二维码</p>
      <div class="qr-card">
        <img id="qrCodeImg" src="" alt="QR Code">
      </div>
      <button class="btn btn-qr-download" id="downloadQr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span data-i18n="downloadQr">下载二维码</span>
      </button>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>GUANGZHOU LUWILL BIOTECHNOLOGY CO., LTD.</p>
    </footer>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="loading-spinner"></div>
  </div>

  <!-- Error -->
  <div class="error-page" id="errorPage" style="display:none">
    <p class="error-text">页面未找到</p>
    <a href="/" class="error-link">返回首页</a>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/js/profile.js"></script>
</body>
</html>
