<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUWILL 管理后台</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-app">
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
      <div class="login-card">
        <h1 class="login-logo">LUWILL</h1>
        <p class="login-subtitle">管理后台</p>
        <input type="password" class="login-input" id="passwordInput" placeholder="请输入管理密码" autocomplete="current-password">
        <button class="login-btn" id="loginBtn">登录</button>
        <p class="login-error" id="loginError"></p>
      </div>
    </div>

    <!-- Main Admin Panel -->
    <div class="admin-panel" id="adminPanel" style="display:none">
      <header class="admin-header">
        <div class="admin-logo">LUWILL <span>管理后台</span></div>
        <div class="admin-actions">
          <button class="theme-toggle" id="themeToggle" aria-label="Switch theme">
            <svg class="theme-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/>
              <line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
          </button>
          <button class="btn btn-primary" id="addEmployeeBtn">+ 新增员工</button>
          <button class="btn btn-ghost" id="logoutBtn">退出</button>
        </div>
      </header>

      <main class="admin-main">
        <div class="employee-list" id="employeeList"></div>
      </main>
    </div>

    <!-- Employee Form Modal -->
    <div class="modal-overlay" id="modalOverlay" style="display:none">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modalTitle">新增员工</h2>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body">
          <form id="employeeForm">
            <input type="hidden" id="empId">

            <div class="form-row">
              <div class="form-group">
                <label>页面标识 (slug) *</label>
                <input type="text" id="empSlug" placeholder="如: nick" required>
                <small>用于 URL: /profile/nick</small>
              </div>
              <div class="form-group">
                <label>姓名 (英文) *</label>
                <input type="text" id="empName" placeholder="Nick Liu" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>姓名 (中文)</label>
                <input type="text" id="empNameCn" placeholder="刘宇亮">
              </div>
              <div class="form-group">
                <label>职位 (英文)</label>
                <input type="text" id="empTitle" placeholder="Founder">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>职位 (中文)</label>
                <input type="text" id="empTitleCn" placeholder="创始人">
              </div>
              <div class="form-group">
                <label>排序权重</label>
                <input type="number" id="empSort" placeholder="0" value="0">
              </div>
            </div>

            <div class="form-divider">联系方式</div>

            <div class="form-row">
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="empEmail" placeholder="email@example.com">
              </div>
              <div class="form-group">
                <label>电话 / WhatsApp</label>
                <input type="text" id="empPhone" placeholder="+86 138 0000 0000">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>微信号</label>
                <input type="text" id="empWechat" placeholder="wechat_id">
              </div>
              <div class="form-group">
                <label>LinkedIn</label>
                <input type="text" id="empLinkedin" placeholder="linkedin.com/in/xxx">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Instagram</label>
                <input type="text" id="empInstagram" placeholder="instagram.com/xxx">
              </div>
              <div class="form-group">
                <label>公司官网</label>
                <input type="text" id="empWebsite" placeholder="www.luwill.com">
              </div>
            </div>

            <div class="form-row" style="justify-content:space-between;align-items:center">
              <label style="margin:0;font-weight:600;color:var(--text-secondary);font-size:0.8rem;letter-spacing:0.5px">自定义联系方式</label>
              <button type="button" id="addContactBtn" onclick="addContactRow()">+ 添加</button>
            </div>
            <div id="customContactsList"></div>

            <div class="form-divider">头像</div>

            <div class="avatar-upload-area" id="avatarUploadArea">
              <div class="avatar-preview" id="avatarPreview">
                <span class="avatar-placeholder-text">点击上传头像</span>
              </div>
              <input type="file" id="avatarFile" accept="image/*" style="display:none">
              <p class="avatar-hint">支持 JPG/PNG，最大 5MB</p>
            </div>
            <input type="hidden" id="empAvatarPath">
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" id="cancelBtn">取消</button>
          <button class="btn btn-primary" id="saveBtn">保存</button>
        </div>
      </div>
    </div>

    <!-- QR Modal -->
    <div class="modal-overlay" id="qrOverlay" style="display:none">
      <div class="modal modal-sm">
        <div class="modal-header">
          <h2>专属二维码</h2>
          <button class="modal-close" id="qrClose">&times;</button>
        </div>
        <div class="modal-body qr-body">
          <img id="qrImage" src="" alt="QR Code">
          <p class="qr-url" id="qrUrl"></p>
          <button class="btn btn-primary" id="downloadQr">下载二维码</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
